name: Publish image

# Manual only. The cluster pins an exact tag, so a build is a deliberate act:
# publish here, then bump the tag in hh-cluster-infra to deploy it.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Image tag to publish, for example 1.0.0
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # A pinned tag is only a rollback target while it keeps pointing at the
            # same bytes. Overwriting one would silently redeploy something else on
            # the next pod restart, so an existing tag fails the run.
            - name: Refuse to overwrite an existing tag
              run: |
                  ref="ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
                  if docker manifest inspect "$ref" > /dev/null 2>&1; then
                    echo "$ref already exists. Pick a new tag."
                    exit 1
                  fi

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
                  # Links the GHCR package to this repository, which is what lets the
                  # package inherit the repository's visibility.
                  labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
